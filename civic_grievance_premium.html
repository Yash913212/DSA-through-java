<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Civic Grievance — Premium Home</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#05101E;
  --surface:#0D1B2E;
  --elevated:#112236;
  --gold:#C9A84C;
  --gold-dim:rgba(201,168,76,0.15);
  --gold-border:rgba(201,168,76,0.35);
  --amber:#F5A623;
  --green:#2ECC8F;
  --blue:#3D8EF0;
  --white:rgba(255,255,255,0.9);
  --muted:rgba(255,255,255,0.4);
  --border:rgba(255,255,255,0.06);
}
html,body{height:100%;background:#000;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;}

.scene{
  position:relative;
  width:375px;
  height:812px;
  border-radius:44px;
  overflow:hidden;
  box-shadow:0 0 0 1.5px #1a3050, 0 40px 80px rgba(0,0,0,0.8), 0 0 60px rgba(201,168,76,0.08);
}

/* ── ANIMATED BACKGROUND CANVAS ── */
canvas#bg{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:0;
}

/* ── SCREEN CONTENT ── */
.screen{
  position:absolute;inset:0;
  z-index:2;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  padding-bottom:90px;
}
.screen::-webkit-scrollbar{display:none;}

/* ── STATUS BAR ── */
.statusbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px 0;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--white);
}
.statusbar .icons{display:flex;align-items:center;gap:6px;}
.battery{
  width:28px;height:13px;border:1px solid rgba(255,255,255,0.5);border-radius:3px;
  position:relative;display:flex;align-items:center;padding:2px;
}
.battery::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:3px;height:6px;background:rgba(255,255,255,0.5);border-radius:0 2px 2px 0;}
.battery-fill{height:100%;width:44%;background:var(--gold);border-radius:1px;}

/* ── HEADER ── */
.header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:20px 24px 12px;
}
.greeting p{font-size:12px;color:var(--muted);letter-spacing:0.3px;margin-bottom:4px;}
.greeting h1{font-size:28px;font-weight:800;color:var(--white);letter-spacing:-0.5px;position:relative;}
.greeting h1::before{content:'';position:absolute;left:-10px;top:4px;width:3px;height:26px;background:var(--gold);border-radius:2px;}
.header-icons{display:flex;gap:10px;margin-top:4px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(13,27,46,0.8);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;
  backdrop-filter:blur(8px);
  transition:transform .2s,border-color .2s;
}
.icon-btn:hover{transform:scale(1.05);border-color:var(--gold-border);}
.icon-btn svg{width:18px;height:18px;}
.notif-dot{
  position:absolute;top:6px;right:6px;
  width:8px;height:8px;background:var(--gold);border-radius:50%;
  border:1.5px solid var(--navy);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{
  0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0.6);}
  50%{box-shadow:0 0 0 4px rgba(201,168,76,0);}
}
.avatar-ring{border:1.5px solid rgba(201,168,76,0.5);}

/* ── HERO CARD ── */
.hero-card{
  margin:4px 20px 0;
  border-radius:22px;
  background:rgba(13,27,46,0.7);
  border:1px solid rgba(201,168,76,0.15);
  padding:24px 22px 20px;
  position:relative;overflow:hidden;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:transform .25s, border-color .25s;
}
.hero-card:hover{transform:scale(1.01);border-color:rgba(201,168,76,0.35);}
.hero-glow{
  position:absolute;left:-20px;top:-20px;
  width:200px;height:200px;
  background:radial-gradient(circle, rgba(201,168,76,0.18) 0%, transparent 70%);
  pointer-events:none;
  animation:hero-breathe 4s ease-in-out infinite;
}
@keyframes hero-breathe{
  0%,100%{opacity:0.6;transform:scale(1);}
  50%{opacity:1;transform:scale(1.1);}
}
.hero-card-inner{display:flex;align-items:center;gap:18px;}
.hero-icon-wrap{
  width:56px;height:56px;border-radius:16px;
  background:rgba(201,168,76,0.12);
  border:1px solid rgba(201,168,76,0.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hero-icon-wrap svg{width:28px;height:28px;}
.hero-text h2{font-size:18px;font-weight:700;color:var(--white);margin-bottom:4px;}
.hero-text p{font-size:12px;color:var(--muted);line-height:1.5;}
.hero-arrow{
  margin-left:auto;width:32px;height:32px;border-radius:50%;
  background:var(--gold-dim);border:1px solid var(--gold-border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hero-pill{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:14px;padding:6px 14px;border-radius:20px;
  background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);
  font-size:11px;color:var(--gold);letter-spacing:0.5px;
}
.hero-bottom-line{
  position:absolute;bottom:0;left:20px;right:20px;
  height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.4),transparent);
}

/* ── SECTION HEADER ── */
.section-header{
  display:flex;align-items:center;gap:10px;
  padding:24px 24px 12px;
}
.section-header::before{content:'';width:3px;height:18px;background:var(--gold);border-radius:2px;}
.section-header span{font-size:15px;font-weight:600;color:var(--white);}

/* ── STATS GRID ── */
.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;padding:0 20px;
}
.stat-card{
  border-radius:18px;
  background:rgba(13,27,46,0.75);
  border:1px solid var(--border);
  padding:18px 16px 14px;
  position:relative;overflow:hidden;
  backdrop-filter:blur(8px);
  transition:transform .2s;
  cursor:pointer;
}
.stat-card:hover{transform:translateY(-2px);}
.stat-card .glow-bg{
  position:absolute;top:-30px;left:-10px;
  width:120px;height:120px;border-radius:50%;
  pointer-events:none;opacity:0.6;
}
.stat-card.amber{border-color:rgba(245,166,35,0.35);}
.stat-card.amber .glow-bg{background:radial-gradient(circle,rgba(245,166,35,0.15),transparent 70%);}
.stat-card.green{border-color:rgba(46,204,143,0.3);}
.stat-card.green .glow-bg{background:radial-gradient(circle,rgba(46,204,143,0.12),transparent 70%);}
.stat-card.blue{border-color:rgba(61,142,240,0.3);}
.stat-card.blue .glow-bg{background:radial-gradient(circle,rgba(61,142,240,0.12),transparent 70%);}
.stat-num{font-size:36px;font-weight:800;line-height:1;margin-bottom:8px;}
.stat-num.white{color:var(--white);}
.stat-num.amber{color:var(--amber);}
.stat-num.green{color:var(--green);}
.stat-num.blue{color:var(--blue);}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:1.8px;font-weight:500;}
.stat-icon{
  position:absolute;top:14px;right:14px;
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.stat-icon svg{width:14px;height:14px;}

/* ── QUICK ACCESS ── */
.quick-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;padding:0 20px;
}
.quick-tile{
  border-radius:18px;
  background:rgba(17,34,54,0.8);
  border:1px solid var(--border);
  padding:16px 8px 14px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  cursor:pointer;
  backdrop-filter:blur(8px);
  transition:transform .2s, border-color .2s;
}
.quick-tile:hover{transform:translateY(-2px);}
.quick-tile.active{border-color:rgba(201,168,76,0.5);}
.quick-icon{
  width:44px;height:44px;border-radius:22px;
  background:rgba(201,168,76,0.12);
  display:flex;align-items:center;justify-content:center;
}
.quick-icon svg{width:20px;height:20px;}
.quick-tile span{font-size:11px;color:rgba(255,255,255,0.7);font-weight:500;}
.quick-tile.active span{color:var(--gold);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;
  height:82px;
  background:rgba(5,16,30,0.9);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  backdrop-filter:blur(16px);
  z-index:10;
  padding:0 10px;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;flex:1;
  transition:transform .2s;
}
.nav-item:hover{transform:scale(1.05);}
.nav-item svg{width:20px;height:20px;}
.nav-item span{font-size:10px;color:var(--muted);}
.nav-item.active svg{color:var(--gold);}
.nav-item.active span{color:var(--gold);}
.nav-dot{width:4px;height:4px;background:var(--gold);border-radius:50%;}
.nav-fab{
  width:56px;height:56px;border-radius:50%;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(201,168,76,0.4);
  flex-shrink:0;
  transition:transform .2s, box-shadow .2s;
  cursor:pointer;
}
.nav-fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(201,168,76,0.55);}
.nav-fab svg{width:22px;height:22px;color:#05101E;}

/* ── DYNAMIC ISLAND ── */
.island{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:120px;height:34px;background:#000;border-radius:17px;
  z-index:20;
}

/* entrance animations */
.fade-up{opacity:0;transform:translateY(20px);animation:fadeUp .6s forwards;}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
.header{animation:fadeUp .5s .1s forwards;opacity:0;}
.hero-card{animation:fadeUp .5s .2s forwards;opacity:0;}
.stats-grid{animation:fadeUp .5s .35s forwards;opacity:0;}
.quick-grid{animation:fadeUp .5s .5s forwards;opacity:0;}
</style>
</head>
<body>
<div class="scene">
  <!-- Animated background -->
  <canvas id="bg"></canvas>

  <!-- Dynamic island -->
  <div class="island"></div>

  <!-- Screen content -->
  <div class="screen">
    <!-- Status bar -->
    <div class="statusbar">
      <span>17:11</span>
      <div class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="rgba(255,255,255,0.9)"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="rgba(255,255,255,0.9)"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="rgba(255,255,255,0.9)"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="rgba(255,255,255,0.3)"/></svg>

    <!-- Header -->
    <div class="header">
      <div class="greeting">
        <p>Welcome back,</p>

      <div class="header-icons">

            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>

            <line x1="22" y1="5" x2="25" y2="3" stroke="#C9A84C" stroke-width="1.4"/><line x1="24" y1="6" x2="26" y2="4" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.6"/>
          </svg>
        </div>
        <div class="hero-text">
          <h2>Report Issue</h2>
          <p>AI will auto-route to department</p>

            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="#C9A84C" stroke-width="1"/><line x1="5" y1="3" x2="5" y2="5" stroke="#C9A84C" stroke-width="1" stroke-linecap="round"/><circle cx="5" cy="6.5" r="0.5" fill="#C9A84C"/></svg>

          </div>

        <div class="hero-arrow">

          <svg viewBox="0 0 14 14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-linecap="round"><path d="M2 3h10M2 7h10M2 11h6"/></svg>

      </div>
      <div class="stat-card amber">

          <svg viewBox="0 0 14 14" fill="none" stroke="#F5A623" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M7 4v3l1.5 1.5"/></svg>
        </div>

  <!-- Bottom nav -->

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = 375;
canvas.height = 812;

const W = canvas.width, H = canvas.height;
let t = 0;

/* ── City skyline data ── */
const buildings = [
  {x:0,w:28,h:160},{x:30,w:22,h:200},{x:54,w:35,h:240},{x:91,w:25,h:180},
  {x:118,w:40,h:290},{x:160,w:28,h:320},{x:190,w:45,h:260},{x:237,w:30,h:300},
  {x:269,w:25,h:220},{x:296,w:38,h:180},{x:336,w:22,h:150},{x:360,w:15,h:130},
];
const windows = [];
buildings.forEach(b => {
  for(let wy = H-b.h+20; wy < H-20; wy+=18){
    for(let wx = b.x+4; wx < b.x+b.w-8; wx+=10){
      if(Math.random()>0.35) windows.push({x:wx,y:wy,on:Math.random()>0.3,flicker:Math.random()<0.05,timer:Math.random()*200});
    }
  }
});

/* ── Hexagonal grid ── */
const hexes = [];
const hexR = 32;
for(let row=0;row<7;row++){
  for(let col=0;col<8;col++){
    hexes.push({
      cx: col*hexR*1.75 + (row%2)*hexR*0.88 - 10,
      cy: row*hexR*1.5 - 60,
      phase: Math.random()*Math.PI*2,
    });
  }
}

/* ── Data stream particles ── */
const streams = [];
for(let i=0;i<6;i++){
  streams.push({
    x: Math.random()*W, y: H*0.4+Math.random()*H*0.2,
    tx: Math.random()*W, ty: 200+Math.random()*200,
    t: Math.random(), speed: 0.003+Math.random()*0.004,
    color: Math.random()>0.5 ? '#C9A84C' : '#3D8EF0',
  });
}

/* ── Floating particles ── */
const particles = Array.from({length:60}, ()=>({
  x:Math.random()*W, y:Math.random()*H,
  vx:(Math.random()-0.5)*0.3, vy:-0.2-Math.random()*0.4,
  r:Math.random()*1.5+0.4,
  alpha:Math.random()*0.6+0.2,
  color:Math.random()>0.6?'#C9A84C':'#3D8EF0',
}));

/* ── Pulse rings ── */
const pulseNodes = [
  {x:120, y:420, r:0, maxR:60, color:'rgba(201,168,76,', speed:0.4},
  {x:260, y:380, r:30, maxR:60, color:'rgba(61,142,240,', speed:0.5},
  {x:190, y:460, r:50, maxR:60, color:'rgba(201,168,76,', speed:0.35},
];

function hexPath(cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i - Math.PI/6;
    const px=cx+r*Math.cos(a), py=cy+r*Math.sin(a);
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function lerp(a,b,t){return a+(b-a)*t;}

function draw(){
  ctx.clearRect(0,0,W,H);

  /* Sky gradient */
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#04101f');
  sky.addColorStop(0.45,'#091a35');
  sky.addColorStop(1,'#030c18');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  /* Atmospheric glow center */
  const atm = ctx.createRadialGradient(W/2,H*0.38,0,W/2,H*0.38,W*0.6);
  atm.addColorStop(0,'rgba(20,50,100,0.3)');
  atm.addColorStop(1,'rgba(20,50,100,0)');
  ctx.fillStyle=atm; ctx.fillRect(0,0,W,H);

  /* Gold horizon glow */
  const hz = ctx.createRadialGradient(W/2,H-220,0,W/2,H-220,280);
  hz.addColorStop(0,'rgba(201,168,76,0.1)');
  hz.addColorStop(1,'rgba(201,168,76,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,0,W,H);

  /* ── Hex grid ── */
  hexes.forEach(h=>{
    const pulse = (Math.sin(t*0.8+h.phase)+1)/2;
    const alpha = 0.05 + pulse*0.12;
    hexPath(h.cx, h.cy, hexR*0.9);
    ctx.strokeStyle=`rgba(201,168,76,${alpha})`;
    ctx.lineWidth=0.6;
    ctx.stroke();
    /* inner dot */
    ctx.beginPath();
    ctx.arc(h.cx,h.cy,2,0,Math.PI*2);
    ctx.fillStyle=`rgba(201,168,76,${alpha*1.5})`;
    ctx.fill();
  });

  /* ── Data stream arcs ── */
  streams.forEach(s=>{
    s.t += s.speed;
    if(s.t>1) s.t=0;
    const prog = s.t;
    const cx1 = lerp(s.x,s.tx,0.33);
    const cy1 = lerp(s.y,s.ty,0.1) - 100;
    const cx2 = lerp(s.x,s.tx,0.66);
    const cy2 = lerp(s.y,s.ty,0.9) - 60;
    /* trail */
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.bezierCurveTo(cx1,cy1,cx2,cy2,s.tx,s.ty);
    ctx.strokeStyle = s.color.replace('#','rgba(').replace('C9A84C','201,168,76,0.12)').replace('3D8EF0','61,142,240,0.1)');
    if(s.color==='#C9A84C') ctx.strokeStyle='rgba(201,168,76,0.12)';
    else ctx.strokeStyle='rgba(61,142,240,0.1)';
    ctx.lineWidth=1;
    ctx.stroke();
    /* moving dot */
    const bx = Math.pow(1-prog,3)*s.x + 3*Math.pow(1-prog,2)*prog*cx1 + 3*(1-prog)*prog*prog*cx2 + Math.pow(prog,3)*s.tx;
    const by = Math.pow(1-prog,3)*s.y + 3*Math.pow(1-prog,2)*prog*cy1 + 3*(1-prog)*prog*prog*cy2 + Math.pow(prog,3)*s.ty;
    ctx.beginPath();
    ctx.arc(bx,by,2.5,0,Math.PI*2);
    ctx.fillStyle = s.color==='#C9A84C' ? 'rgba(201,168,76,0.9)' : 'rgba(61,142,240,0.9)';
    ctx.fill();
    /* glow */
    const grd = ctx.createRadialGradient(bx,by,0,bx,by,8);
    grd.addColorStop(0, s.color==='#C9A84C'?'rgba(201,168,76,0.3)':'rgba(61,142,240,0.3)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill();
  });

  /* ── Pulse rings ── */
  pulseNodes.forEach(p=>{
    p.r += p.speed;
    if(p.r>p.maxR) p.r=0;
    const alpha = (1-p.r/p.maxR)*0.5;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.strokeStyle=p.color+alpha+')';
    ctx.lineWidth=1;
    ctx.stroke();
  });

  /* ── City buildings ── */
  buildings.forEach(b=>{
    ctx.fillStyle='rgba(8,20,40,0.95)';
    ctx.fillRect(b.x, H-b.h, b.w, b.h);
    /* edge highlight */
    ctx.strokeStyle='rgba(30,60,100,0.4)';
    ctx.lineWidth=0.5;
    ctx.strokeRect(b.x,H-b.h,b.w,b.h);
  });

  /* ── Windows ── */
  windows.forEach(w=>{
    w.timer--;
    if(w.timer<=0 && w.flicker){w.on=!w.on;w.timer=80+Math.random()*200;}
    if(!w.on) return;
    const alpha = 0.4+Math.sin(t*0.5+w.x)*0.15;
    const warm = Math.random()>0.7;
    ctx.fillStyle = warm ? `rgba(201,168,76,${alpha})` : `rgba(120,180,255,${alpha*0.8})`;
    ctx.fillRect(w.x,w.y,4,4);
  });

  /* ── Road ── */
  ctx.fillStyle='rgba(3,8,15,0.98)';
  ctx.fillRect(0,H-80,W,80);
  ctx.strokeStyle='rgba(25,50,80,0.5)';
  ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(0,H-80);ctx.lineTo(W,H-80);ctx.stroke();
  /* road dashes */
  ctx.setLineDash([18,14]);
  ctx.strokeStyle='rgba(201,168,76,0.25)';
  ctx.lineWidth=1;
  for(let lane=0;lane<3;lane++){
    ctx.beginPath();
    ctx.moveTo(0,H-50+lane*15);ctx.lineTo(W,H-50+lane*15);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  /* ── Floating particles ── */
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
    if(p.x<-10||p.x>W+10){p.x=Math.random()*W;}
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = p.color==='#C9A84C'?`rgba(201,168,76,${p.alpha})`:`rgba(61,142,240,${p.alpha})`;
    ctx.fill();
  });

  /* ── Stars ── */
  for(let i=0;i<30;i++){
    const sx=(i*137.5+t*0.1)%W;
    const sy=(i*79.3)%300;
    const sa=0.2+Math.sin(t*0.5+i)*0.2;
    ctx.beginPath();ctx.arc(sx,sy,0.7,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${sa})`;ctx.fill();
  }

  t+=0.03;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
